name: ARUUN Repository Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['**/*.md','TOOLS/REPOSITORY/**','.github/workflows/aruun-audit.yml']
permissions: {contents: write}
concurrency: {group: aruun-repository-audit, cancel-in-progress: true}
jobs:
  audit:
    name: Audit ARUUN repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.x'}
      - name: Run read-only repository validator
        run: python TOOLS/REPOSITORY/validate_repo.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run read-only World Bible layout validation — primary Mythroot CORE mode
        run: python TOOLS/REPOSITORY/validator/world_bible_layout_engine.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE read-only corpus observer boundary
        run: python TOOLS/REPOSITORY/validator/core_corpus_observer.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Build CORE contextual semantic relationship library
        run: python TOOLS/REPOSITORY/validator/core_semantic_library.py --out TOOLS/REPOSITORY/REPORTS
      - name: Extract CORE contextual semantic claims from document language
        run: python TOOLS/REPOSITORY/validator/core_semantic_claims.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Extract CORE information units for semantic comparison
        run: python TOOLS/REPOSITORY/validator/core_information_units.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Resolve first-class CORE document identity before placement and lineage
        run: python -m py_compile TOOLS/REPOSITORY/validator/core_document_identity.py
      - name: Run CORE structural identity calibration fixtures
        run: python TOOLS/REPOSITORY/validator/core_identity_calibration.py
      - name: Run read-only content placement audit
        run: python TOOLS/REPOSITORY/validator/content_placement_engine.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run read-only content lineage audit
        run: python TOOLS/REPOSITORY/validator/content_lineage_engine.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Build read-only canonical assembly review
        run: python TOOLS/REPOSITORY/validator/canonical_assembly_engine.py --root . --report TOOLS/REPOSITORY/REPORTS/CONTENT_LINEAGE_REPORT.json --out TOOLS/REPOSITORY/REPORTS
      - name: Build read-only canonical consolidation review
        run: python TOOLS/REPOSITORY/validator/canonical_consolidation_review.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE A.C.E. adaptive calibration engine
        run: python TOOLS/REPOSITORY/validator/core_ace.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Discover CORE relationships across active world scopes
        run: python TOOLS/REPOSITORY/validator/core_relationship_discovery.py --root . --scope 03_PEOPLES/CULTURES/HEARTH --scope 01_WORLD/PLANET --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE pairwise semantic comparator
        run: python TOOLS/REPOSITORY/validator/core_semantic_comparator.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Apply evidence-gated CORE VARIANT arbitration
        run: python TOOLS/REPOSITORY/validator/core_variant_gate.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Build CORE human adjudication queue
        run: python TOOLS/REPOSITORY/validator/core_adjudication_queue.py --root . --out TOOLS/REPOSITORY/REPORTS --limit 30
      - name: Run CORE document triage — direct answers before deep investigation
        run: python TOOLS/REPOSITORY/validator/core_document_triage.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE placement-first benchmark
        run: python TOOLS/REPOSITORY/validator/core_placement_benchmark.py
      - name: Run CORE document disposition calibration
        run: python TOOLS/REPOSITORY/validator/core_document_disposition_calibration.py
      - name: Build CORE read-only document disposition report
        run: python TOOLS/REPOSITORY/validator/core_document_disposition.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Build CORE relationship ontology policy audit
        run: python TOOLS/REPOSITORY/validator/core_relationship_policy.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Build CORE multi-dimensional evidence matrix
        run: python TOOLS/REPOSITORY/validator/core_evidence_matrix.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Build CORE deciding-factor coverage audit
        run: python TOOLS/REPOSITORY/validator/core_deciding_factor_audit.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Build CORE leakage-safe mugshot/exemplar library
        run: python TOOLS/REPOSITORY/validator/core_exemplar_pool.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE A.C.E. Robin deciding-factor investigation — independent research
        run: python TOOLS/REPOSITORY/validator/core_robin.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE A.C.E. Detective case solver — consumes Robin factor map
        run: python TOOLS/REPOSITORY/validator/core_detective.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Cross-check Batman and Robin
        run: python TOOLS/REPOSITORY/validator/core_crosscheck.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE A.C.E. Oracle association intelligence
        run: python TOOLS/REPOSITORY/validator/core_oracle.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE A.C.E. Nightwing synthesis
        run: python TOOLS/REPOSITORY/validator/core_nightwing.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE A.C.E. Alfred mediation
        run: python TOOLS/REPOSITORY/validator/core_alfred.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE A.C.E. blind benchmark — evaluation only after live reasoning
        run: python TOOLS/REPOSITORY/validator/core_blind_test.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Reconcile human blind-test annotations to stable relationship IDs
        run: python TOOLS/REPOSITORY/validator/core_human_reconcile.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Migrate historical relationship labels onto ontology v2
        run: python TOOLS/REPOSITORY/validator/core_relationship_migration.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Build ontology v2 review patterns
        run: python TOOLS/REPOSITORY/validator/core_ontology_v2_review_patterns.py
      - name: Run true-blind ontology v2 benchmark
        run: python TOOLS/REPOSITORY/validator/core_ontology_v2_true_blind.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run CORE relationship discovery metrics
        run: python TOOLS/REPOSITORY/validator/core_relationship_metrics.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Re-run CORE relationship ontology policy audit after reconciliation
        run: python TOOLS/REPOSITORY/validator/core_relationship_policy.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run read-only continuity engine
        run: python TOOLS/REPOSITORY/validator/continuity_engine.py --root . --out TOOLS/REPOSITORY/REPORTS
      - name: Run Hearth continuity audit
        run: python TOOLS/REPOSITORY/validator/continuity_engine.py --root . --scope 03_PEOPLES/CULTURES/HEARTH --out TOOLS/REPOSITORY/REPORTS/HEARTH
      - name: Run Hearth regional continuity audits
        run: |
          for region in PLAINS MOUNTAINS RIVER WETLANDS DESERT COAST; do
            python TOOLS/REPOSITORY/validator/continuity_engine.py --root . --scope "03_PEOPLES/CULTURES/HEARTH/$region" --out "TOOLS/REPOSITORY/REPORTS/HEARTH/$region"
          done
      - name: Run disposable continuity detector test
        run: python TOOLS/REPOSITORY/validator/continuity_engine.py --root . --scope TOOLS/REPOSITORY/CONTINUITY_TEST --include-test-fixtures --out TOOLS/REPOSITORY/REPORTS/CONTINUITY_TEST
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: aruun-repository-audit-${{ github.run_number }}
          path: TOOLS/REPOSITORY/REPORTS/
          if-no-files-found: error
          retention-days: 30
      - name: Commit audit reports to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TOOLS/REPOSITORY/REPORTS/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(audit): update repository audit reports"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard origin/main
            git add TOOLS/REPOSITORY/REPORTS/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "chore(audit): update repository audit reports"
            sleep $((attempt * 2))
          done
          echo "Unable to publish audit reports after three synchronized attempts." >&2
          exit 1
      - name: Print audit summary
        if: always()
        run: |
          for f in AUDIT_SUMMARY.md CORE_CORPUS_OBSERVER.md CONTENT_PLACEMENT_REPORT.md CONTENT_LINEAGE_REPORT.md CANONICAL_ASSEMBLY_REVIEW.md CANONICAL_CONSOLIDATION_REVIEW.md CORE_ACE_CALIBRATION_REPORT.md CORE_RELATIONSHIP_DISCOVERY.md CORE_SEMANTIC_COMPARATOR.md CORE_VARIANT_GATE.md CORE_INFORMATION_UNITS.md CORE_ADJUDICATION_QUEUE.md CORE_DOCUMENT_TRIAGE.md CORE_DOCUMENT_DISPOSITION.md CORE_RELATIONSHIP_POLICY.md CORE_RELATIONSHIP_ONTOLOGY_V2.md CORE_EVIDENCE_MATRIX.md CORE_DECIDING_FACTOR_AUDIT.md CORE_EXEMPLAR_POOL.md CORE_SEMANTIC_LIBRARY.md CORE_SEMANTIC_CLAIMS.md CORE_WORLD_BIBLE_LAYOUT_REPORT.md CORE_DETECTIVE_REPORT.md CORE_ROBIN_REPORT.md CORE_CROSSCHECK_REPORT.md CORE_ORACLE_REPORT.md CORE_NIGHTWING_REPORT.md CORE_ALFRED_REPORT.md CORE_BLIND_TEST.md CORE_HUMAN_RECONCILIATION.md CORE_RELATIONSHIP_METRICS.md CONTINUITY_REPORT.md; do
            [ -f "TOOLS/REPOSITORY/REPORTS/$f" ] && cat "TOOLS/REPOSITORY/REPORTS/$f"
          done
          for f in CORE_CORPUS_OBSERVER.json CORE_ONTOLOGY_V2_TRUE_BLIND_REPORT.json CORE_ONTOLOGY_V2_TRUE_BLIND_PREDICTIONS.json CORE_ONTOLOGY_REVIEW_PATTERNS.json CORE_PLACEMENT_BENCHMARK.json; do
            [ -f "TOOLS/REPOSITORY/REPORTS/$f" ] && cat "TOOLS/REPOSITORY/REPORTS/$f"
          done
          [ -f TOOLS/REPOSITORY/REPORTS/HEARTH/CONTINUITY_REPORT.md ] && cat TOOLS/REPOSITORY/REPORTS/HEARTH/CONTINUITY_REPORT.md
          for region in PLAINS MOUNTAINS RIVER WETLANDS DESERT COAST; do
            f="TOOLS/REPOSITORY/REPORTS/HEARTH/$region/CONTINUITY_REPORT.md"
            [ -f "$f" ] && { echo "===== HEARTH/$region ====="; cat "$f"; }
          done
          [ -f TOOLS/REPOSITORY/REPORTS/CONTINUITY_TEST/CONTINUITY_REPORT.md ] && cat "TOOLS/REPOSITORY/REPORTS/CONTINUITY_TEST/CONTINUITY_REPORT.md"
